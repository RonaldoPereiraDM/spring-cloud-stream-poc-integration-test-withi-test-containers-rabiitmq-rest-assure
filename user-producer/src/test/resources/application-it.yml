server:
  port: 8080
spring:
  application:
    name: user-consumer
  datasource:
    url: jdbc:postgresql://localhost:5434/consumer-db
    username: ronaldo
    password: ronaldo
    sql:
      init:
        mode: always
    jpa:
      show-sql: true
      hibernate:
        ddl-auto: none  # Importante: previne o Hibernate de tentar criar as tabelas
      properties:
        hibernate:
          default_schema: consumer-db
          dialect: org.hibernate.dialect.PostgreSQLDialect
          jdbc:
            lob:
              non-contextual-creation: true
  rabbitmq:
    username: guest
    password: guest
    host: localhost
    port: 5672
  # ========================================
  # NÍVEL 1: BINDING DO SPRING CLOUD STREAM
  # ========================================
  # Propósito: Liga APLICAÇÃO → CANAL ABSTRATO
  # Abstração: Funciona com qualquer broker (RabbitMQ, Kafka, etc.)
  cloud:
    stream:
      bindings:                                   # ← BINDING NÍVEL 1 (Abstrato)
        userEventSupplier-out-0:                  # ← Nome da função Spring
          destination: ead.userevent              # ← CANAL ABSTRATO (não é especificamente RabbitMQ)
          content-type: application/json          # ← Configuração genérica
        paymentEventSupplier-out-0:
          destination: ead.paymentevent
          content-type: application/json

      # ========================================
      # NÍVEL 2: BINDING DO RABBITMQ
      # ========================================
      # Propósito: Liga CANAL ABSTRATO → INFRAESTRUTURA REAL do RabbitMQ
      rabbit:                                     # ← Configurações específicas do RabbitMQ
        bindings:                                 # ← BINDING NÍVEL 2 (Específico RabbitMQ)
          userEventSupplier-out-0:                # ← Referencia o mesmo binding do nível 1
            producer:                             # ← Configurações do PRODUTOR RabbitMQ
              exchange-type: fanout               # ← ESPECÍFICO RabbitMQ: tipo do exchange
              routing-key: ""                     # ← ESPECÍFICO RabbitMQ: chave de roteamento
              declare-exchange: true              # ← ESPECÍFICO RabbitMQ: criar exchange
              exchange-durable: true              # ← ESPECÍFICO RabbitMQ: persistência

    test-binder: true

        # O QUE ESTE BINDING FAZ:
        # ✓ Pega os canais abstrato "app.v1.event.app-created" e "app.v1.event.app-updated"
        # ✓ Mapeia para dois EXCHANGE's tipo fanout concretos no RabbitMQ
        # ✓ Define características específicas do RabbitMQ

  ## Flyway Configs
  flyway:
    #Essa propriedade serve para ativarmos o Flyway
    enabled: true
    locations: classpath:db/migration

    #Essa propriedade para criar uma tabela com as migrações e assim ter acesso ao histórico de modificações.
    baseline-on-migrate: true
    user: ronaldo
    password: ronaldo

    # Valida se as migrações aplicadas no banco correspondem aos arquivos de migração
    # Ajuda a detectar mudanças não autorizadas nas migrações já executadas
    validate-on-migrate: true

    # Permite o uso do comando Flyway clean (que limpa todas as tabelas)
    # CUIDADO: Em produção, isso deveria ser true para evitar deleção acidental dos dados
    clean-disabled: false

    # Permite que o Flyway crie os schemas se eles não existirem
    # Útil durante o desenvolvimento, mas considere false em produção
    create-schemas: false

    # Schema padrão onde o Flyway irá criar sua tabela de histórico e executar migrações
    # Deve corresponder ao schema principal da sua aplicação
    default-schema: consumer-db
    init-sqls: |
      CREATE SCHEMA IF NOT EXISTS "consumer-db";
      ALTER DATABASE "consumer-db" SET search_path TO "consumer-db";